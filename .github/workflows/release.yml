name: Release veröffentlichen
on:
  push:
    branches: [release-assets]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfsummen kontrollieren
        run: |
          cd files
          python3 - <<'PY'
          import json, hashlib, os
          v = json.load(open('version.json'))
          for k, d in v['downloads'].items():
              f = os.path.basename(d['url'])
              h = hashlib.sha256(open(f, 'rb').read()).hexdigest()
              assert h == d['sha256'], f'{f}: Prüfsumme stimmt nicht'
              print('ok', f)
          PY
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json;print(json.load(open('files/version.json'))['version'])")
          gh release view "v$V" >/dev/null 2>&1 && { echo "v$V existiert bereits"; exit 0; }
          gh release create "v$V" --target main --title "Arefi ITPraxis $V" --notes-file files/NOTES.md \
            files/*.exe files/*.zip files/*.deb files/*.tar.gz files/version.json files/version.json.sig
